---
- name: Installer le serveur web
  ansible.builtin.apt:
    name: "{{ webserver_package }}"
    state: present
    update_cache: true
    lock_timeout: 300

- name: Déployer la page d'accueil
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_docroot }}/index.html"
    mode: "0644"
  notify: Redémarrer le serveur web

- name: Démarrer et activer le serveur web
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
